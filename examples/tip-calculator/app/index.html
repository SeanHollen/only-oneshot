<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip Calculator</title>
<style>
  :root {
    --bg: #f4f4f2;
    --card: #ffffff;
    --soft: #f7f7f5;
    --line: #e2e2de;
    --text: #1f2328;
    --muted: #6a6f76;
    --accent: #4f6d7a;      /* muted slate blue */
    --accent-soft: #e9eef0;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.4;
    min-height: 100vh;
    padding: 24px 16px 40px;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 440px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: .02em;
    color: var(--muted);
    margin: 0 0 14px 4px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
  }
  .card + .card { margin-top: 14px; }

  /* Results */
  .results { background: var(--soft); }
  .per-person-label {
    font-size: .85rem;
    color: var(--muted);
    margin: 0 0 2px;
  }
  .per-person {
    font-size: clamp(2.6rem, 13vw, 3.5rem);
    font-weight: 650;
    color: var(--accent);
    letter-spacing: -.02em;
    line-height: 1.1;
    margin: 0;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .secondary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .secondary dt { font-size: .8rem; color: var(--muted); }
  .secondary dd {
    margin: 2px 0 0;
    font-size: 1.15rem;
    font-weight: 550;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }

  /* Inputs */
  .field + .field { margin-top: 20px; }
  .field > label, .field > .label {
    display: block;
    font-size: .85rem;
    font-weight: 550;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-wrap .prefix, .input-wrap .suffix {
    position: absolute;
    color: var(--muted);
    font-size: 1.1rem;
    pointer-events: none;
  }
  .input-wrap .prefix { left: 14px; }
  .input-wrap .suffix { right: 14px; }
  input[type="text"] {
    width: 100%;
    min-width: 0;
    height: 52px;
    font: inherit;
    font-size: 1.15rem;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0 14px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="text"]::placeholder { color: #a3a7ac; }
  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #bill { padding-left: 32px; }

  .tips {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .tip-btn {
    height: 48px;
    font: inherit;
    font-size: 1.05rem;
    font-weight: 550;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background .15s, border-color .15s, color .15s;
  }
  .tip-btn:hover { border-color: #c9c9c4; }
  .tip-btn[aria-checked="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .tip-btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 1px; }
  .custom-wrap { margin-top: 8px; }
  #custom { padding-right: 36px; }
  #custom.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }

  .stepper {
    display: grid;
    grid-template-columns: 52px 1fr 52px;
    gap: 8px;
  }
  .step-btn {
    height: 52px;
    font: inherit;
    font-size: 1.5rem;
    line-height: 1;
    color: var(--text);
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .step-btn:disabled { color: #b8bbbf; cursor: default; }
  .step-btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 1px; }
  #people { text-align: center; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<main>
  <h1>Tip Calculator</h1>

  <section class="card results" aria-live="polite" aria-label="Results">
    <p class="per-person-label">Each person pays</p>
    <p class="per-person" id="perPerson">$0.00</p>
    <dl class="secondary">
      <div>
        <dt>Tip</dt>
        <dd id="tipAmount">$0.00</dd>
      </div>
      <div>
        <dt>Total</dt>
        <dd id="totalAmount">$0.00</dd>
      </div>
    </dl>
  </section>

  <section class="card" aria-label="Inputs">
    <div class="field">
      <label for="bill">Bill amount</label>
      <div class="input-wrap">
        <span class="prefix">$</span>
        <input id="bill" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
      </div>
    </div>

    <div class="field">
      <span class="label" id="tipLabel">Tip</span>
      <div class="tips" role="radiogroup" aria-labelledby="tipLabel">
        <button type="button" class="tip-btn" role="radio" data-tip="15" aria-checked="false">15%</button>
        <button type="button" class="tip-btn" role="radio" data-tip="18" aria-checked="true">18%</button>
        <button type="button" class="tip-btn" role="radio" data-tip="20" aria-checked="false">20%</button>
      </div>
      <div class="custom-wrap input-wrap">
        <label for="custom" class="sr-only">Custom tip percentage</label>
        <input id="custom" type="text" inputmode="decimal" autocomplete="off" placeholder="Custom">
        <span class="suffix">%</span>
      </div>
    </div>

    <div class="field">
      <label for="people">Number of people</label>
      <div class="stepper">
        <button type="button" class="step-btn" id="minus" aria-label="Fewer people">&minus;</button>
        <input id="people" type="text" inputmode="numeric" autocomplete="off" value="1">
        <button type="button" class="step-btn" id="plus" aria-label="More people">+</button>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  var bill = document.getElementById('bill');
  var custom = document.getElementById('custom');
  var people = document.getElementById('people');
  var minus = document.getElementById('minus');
  var plus = document.getElementById('plus');
  var tipBtns = Array.prototype.slice.call(document.querySelectorAll('.tip-btn'));
  var out = {
    per: document.getElementById('perPerson'),
    tip: document.getElementById('tipAmount'),
    total: document.getElementById('totalAmount')
  };

  var presetTip = 18;      // currently selected preset (null when custom is used)
  var fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

  // Keep only digits and (optionally) a single decimal point.
  function cleanDecimal(v, maxDecimals) {
    v = v.replace(/[^\d.]/g, '');
    var i = v.indexOf('.');
    if (i !== -1) {
      var frac = v.slice(i + 1).replace(/\./g, '');
      if (maxDecimals != null) frac = frac.slice(0, maxDecimals);
      v = v.slice(0, i + 1) + frac;
    }
    return v;
  }
  function cleanDigits(v) { return v.replace(/\D/g, ''); }

  // Apply a sanitizer while keeping the caret in a sensible place.
  function sanitize(input, fn) {
    var before = input.value;
    var caret = input.selectionStart == null ? before.length : input.selectionStart;
    var after = fn(before);
    if (after !== before) {
      var leftClean = fn(before.slice(0, caret)).length;
      input.value = after;
      var pos = Math.min(leftClean, after.length);
      try { input.setSelectionRange(pos, pos); } catch (e) {}
    }
  }

  function num(v) {
    var n = parseFloat(v);
    return isFinite(n) && n > 0 ? n : 0;
  }
  function peopleCount() {
    var n = parseInt(people.value, 10);
    return isFinite(n) && n >= 1 ? n : 1;
  }
  function tipPercent() {
    return presetTip != null ? presetTip : num(custom.value);
  }

  function render() {
    var b = num(bill.value);
    var pct = tipPercent();
    var n = peopleCount();
    var tip = Math.round(b * pct) / 100;           // cents-accurate
    var total = b + tip;
    var per = total / n;
    out.tip.textContent = fmt.format(Math.max(0, tip));
    out.total.textContent = fmt.format(Math.max(0, total));
    out.per.textContent = fmt.format(Math.max(0, per));
    minus.disabled = n <= 1;
  }

  function selectPreset(value) {
    presetTip = value;
    tipBtns.forEach(function (b) {
      b.setAttribute('aria-checked', String(Number(b.dataset.tip) === value));
    });
    custom.classList.toggle('active', value == null);
  }

  bill.addEventListener('input', function () {
    sanitize(bill, function (v) { return cleanDecimal(v, 2); });
    render();
  });

  custom.addEventListener('input', function () {
    sanitize(custom, function (v) { return cleanDecimal(v, 2); });
    if (custom.value !== '') selectPreset(null);
    else if (presetTip == null) selectPreset(18);
    render();
  });
  custom.addEventListener('focus', function () {
    if (custom.value !== '') { selectPreset(null); render(); }
  });

  tipBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      selectPreset(Number(btn.dataset.tip));
      custom.value = '';
      render();
    });
  });

  people.addEventListener('input', function () {
    sanitize(people, function (v) { return cleanDigits(v).slice(0, 4); });
    render();
  });
  people.addEventListener('blur', function () {
    people.value = String(peopleCount());
    render();
  });

  minus.addEventListener('click', function () {
    people.value = String(Math.max(1, peopleCount() - 1));
    render();
  });
  plus.addEventListener('click', function () {
    people.value = String(Math.min(9999, peopleCount() + 1));
    render();
  });

  render();
})();
</script>
</body>
</html>
